name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # site/install is the copy the static host serves at /install. It must stay
  # byte-identical to the canonical install.sh, so drift fails the build.
  installer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sh -n install.sh
      - name: site/install matches install.sh
        run: |
          if ! cmp -s install.sh site/install; then
            echo "site/install is stale. Run: cp install.sh site/install" >&2
            diff install.sh site/install || true
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Includes the golden anchoring tests, the verdict table, and the
      # end-to-end pipeline test with the model API stubbed.
      - run: go test ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # vue-tsc type-check plus the production build; fails if the embedded
      # assets can no longer be produced.
      - run: npm run build
        working-directory: web
