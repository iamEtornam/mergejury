name: release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The SQLite driver is cgo-free, so every target cross-compiles from
      # one runner with no toolchain juggling.
      - name: build release archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%%/*}"; arch="${target##*/}"
            bin=mergejury; [ "$os" = windows ] && bin=mergejury.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/$bin" ./cmd/mergejury
            name="mergejury_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd build && zip -q "../dist/${name}.zip" "$bin")
            else
              tar -czf "dist/${name}.tar.gz" -C build "$bin"
            fi
            rm -f "build/$bin"
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "${{ github.ref_name }}" \
            --generate-notes
