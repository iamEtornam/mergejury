name: release

# Tag a version to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# Can also be run manually against an existing tag, which rebuilds and
# replaces that release's assets.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to rebuild and publish"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      # The SQLite driver is cgo-free, so every target cross-compiles from
      # one runner with no toolchain juggling.
      - name: build release archives
        env:
          VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64 windows/amd64; do
            os="${target%%/*}"; arch="${target##*/}"
            bin=mergejury; [ "$os" = windows ] && bin=mergejury.exe
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "build/$bin" ./cmd/mergejury
            name="mergejury_${VERSION}_${os}_${arch}"
            if [ "$os" = windows ]; then
              (cd build && zip -q "../dist/${name}.zip" "$bin")
            else
              tar -czf "dist/${name}.tar.gz" -C build "$bin"
            fi
            rm -f "build/$bin"

            # The landing-page server, for hosts without a Go toolchain.
            if [ "$os" != windows ]; then
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags "-s -w" -o build/mergejury-site ./cmd/site
              tar -czf "dist/mergejury-site_${VERSION}_${os}_${arch}.tar.gz" -C build mergejury-site
              rm -f build/mergejury-site
            fi
          done
          (cd dist && sha256sum * > checksums.txt)
          ls -la dist

      # Idempotent: re-tagging or re-running replaces the assets instead of
      # failing with "a release with the same tag name already exists".
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; replacing its assets"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --generate-notes
          fi
